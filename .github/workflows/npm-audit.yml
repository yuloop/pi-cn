name: npm audit

on:
  schedule:
    - cron: '37 11 * * *'
  workflow_dispatch:

concurrency:
  group: npm-audit
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  slot-guard:
    name: 同槽位已有更早的 run 则取消本次
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: 取消重复的定时运行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_FILE: npm-audit.yml
          SLOT_MIN: "37"
          SLOT_HOURS: "11"
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "非定时触发（$EVENT_NAME），放行"
            exit 0
          fi
          now=$(date -u +%s)
          # 只在最近 12 小时里找「最接近本次触发的那个 cron 槽位」：
          # 不走「today/yesterday 取最大」——那样在今天的槽位还没到时会回退到昨天的槽位，
          # 拿一天前的时间当起点，什么都能匹配上。
          slot=0
          for h in $SLOT_HOURS; do
            for d in 0 1 2; do
              day=$(date -u -d "$d day ago" +%Y-%m-%d)
              c=$(date -u -d "$day $h:$SLOT_MIN" +%s 2>/dev/null || true)
              if [ -n "$c" ] && [ "$c" -le "$now" ] && [ $((now-c)) -le 43200 ] && [ "$c" -gt "$slot" ]; then slot=$c; fi
            done
          done
          if [ "$slot" -eq 0 ]; then echo "最近 12 小时无对应槽位，放行"; exit 0; fi
          earlier=0
          while read -r id ts; do
            [ -z "$id" ] && continue
            [ "$id" = "$RUN_ID" ] && continue
            c=$(date -u -d "$ts" +%s 2>/dev/null || echo 0)
            if [ "$c" -ge "$slot" ]; then earlier=$((earlier+1)); fi
          done <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_FILE/runs?per_page=50" --jq '.workflow_runs[] | "\(.id) \(.created_at)"')"
          echo "槽位起点=$slot 同槽更早 run=$earlier"
          if [ "$earlier" -gt 0 ]; then
            echo "本槽位已有更早的 run，取消这次重复运行"
            gh run cancel "$RUN_ID" -R "$GITHUB_REPOSITORY" || true
          fi
  audit:
    needs: slot-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production vulnerabilities
        run: node scripts/npm-audit.mjs

      - name: Verify registry signatures
        run: npm audit signatures --omit=dev
