name: Pi Sync Upstream
on:
  schedule:
    - cron: "23 0,8,16 * * *"   # 每天 3 次（00/08/16 UTC）:23；每次合并会触发 45-110 分钟 CI，不宜更密
  workflow_dispatch:
concurrency:
  group: pi-cn-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  slot-guard:
    name: 同槽位已有更早的 run 则取消本次
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: 取消重复的定时运行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WF_FILE: pi-cn-sync.yml
          SLOT_MIN: "23"
          SLOT_HOURS: "0 8 16"
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "非定时触发（$EVENT_NAME），放行"
            exit 0
          fi
          now=$(date -u +%s)
          # 只在最近 12 小时里找「最接近本次触发的那个 cron 槽位」：
          # 不走「today/yesterday 取最大」——那样在今天的槽位还没到时会回退到昨天的槽位，
          # 拿一天前的时间当起点，什么都能匹配上。
          slot=0
          for h in $SLOT_HOURS; do
            for d in 0 1 2; do
              day=$(date -u -d "$d day ago" +%Y-%m-%d)
              c=$(date -u -d "$day $h:$SLOT_MIN" +%s 2>/dev/null || true)
              if [ -n "$c" ] && [ "$c" -le "$now" ] && [ $((now-c)) -le 43200 ] && [ "$c" -gt "$slot" ]; then slot=$c; fi
            done
          done
          if [ "$slot" -eq 0 ]; then echo "最近 12 小时无对应槽位，放行"; exit 0; fi
          earlier=0
          while read -r id ts; do
            [ -z "$id" ] && continue
            [ "$id" = "$RUN_ID" ] && continue
            c=$(date -u -d "$ts" +%s 2>/dev/null || echo 0)
            if [ "$c" -ge "$slot" ]; then earlier=$((earlier+1)); fi
          done <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_FILE/runs?per_page=50" --jq '.workflow_runs[] | "\(.id) \(.created_at)"')"
          echo "槽位起点=$slot 同槽更早 run=$earlier"
          if [ "$earlier" -gt 0 ]; then
            echo "本槽位已有更早的 run，取消这次重复运行"
            gh run cancel "$RUN_ID" -R "$GITHUB_REPOSITORY" || true
          fi
  sync:
    needs: slot-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge upstream into main
        run: |
          set -euo pipefail
          git config user.name "yuloop"
          git config user.email "yuloop@users.noreply.github.com"
          git remote add upstream "https://github.com/earendil-works/pi.git"
          git fetch upstream main
          # 无新提交 → 静默退出（不产生任何 commit）
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游无新提交，跳过"
            exit 0
          fi
          # fork 关系、共享历史：普通 merge 即可
          # --no-commit：暂存 merge 不自动提交，给下面的 restore 机会
          # 上游带入的 .github/workflows 文件（如 build-binaries.yml）需要 workflows 权限才能 push
          # GITHUB_TOKEN 只有 contents: write，没有 workflows 权限，
          # 所以 merge 后 restore 本仓库的 workflow 目录，防止 push 被拒
          git config user.name "yuloop"
          git config user.email "yuloop@users.noreply.github.com"
          git config merge.ours.driver true
          printf '.github/workflows/build-binaries.yml merge=ours\n' >> .git/info/attributes
          printf 'packages/ai/src/providers/cloudflare-ai-gateway.ts merge=ours\n' >> .git/info/attributes
          # README 顶部有本仓库的汉化说明，不能被上游覆盖
          printf 'README.md merge=ours\n' >> .git/info/attributes
          git merge --allow-unrelated-histories --no-commit --no-edit FETCH_HEAD 2>&1 || true
          # Resolve conflicts
          if [ -n "$(git diff --name-only --diff-filter=U 2>/dev/null)" ]; then
            echo "Resolving conflicts: taking upstream for source code"
            git diff --name-only --diff-filter=U | while read -r f; do
              git checkout --theirs "$f" 2>/dev/null || true
            done
            git checkout HEAD -- .github/workflows/ pi-i18n/ README.md packages/ai/src/providers/cloudflare-ai-gateway.ts 2>/dev/null || true
            git add -A 2>/dev/null || true
          fi
          git restore --source=HEAD --staged --worktree .github/workflows
          # `git restore` 只还原 HEAD 里已存在的文件，不会删除上游「新增」的 workflow
          # （nix.yml / preview-packages.yml / publish-model-catalog.yml）。
          # 残留会让 push 因缺少 workflows 权限被拒，这里显式删掉。
          git ls-files .github/workflows | while IFS= read -r f; do
            if ! git cat-file -e "HEAD:$f" 2>/dev/null; then
              echo "移除上游新增的 workflow: $f"
              git rm -f -q "$f"
            fi
          done
          # 兜底自检：暂存区里的 .github/workflows 必须与 HEAD 完全一致
          if ! git diff --cached --quiet HEAD -- .github/workflows; then
            echo "ERROR: .github/workflows 仍与 HEAD 有差异，拒绝 push"
            git diff --cached HEAD -- .github/workflows --name-status | head -20
            exit 3
          fi
          git commit --no-edit || echo "无变更，跳过提交"
          git push origin main
